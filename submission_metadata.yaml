# ============================================================================
# AI tools declaration
# ============================================================================
# Transparency only — declared use is NOT penalized. Be honest.
ai_tools_used:
  - "Gemini"          # Architecture discussion, code review
  - "GitHub Copilot"  # Autocomplete

ai_usage_summary: |
  Used Gemini for architecture discussion, code review, and evaluation report
  drafting. Used GitHub Copilot for code autocomplete during development.
  No candidate data was fed to any external LLM. All scoring logic is
  deterministic Python — no LLM inference occurs during ranking.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Hybrid ranker combining deterministic feature scoring (85%) with MiniLM
  semantic similarity (15%). Five feature components: title score (0–35 pts)
  evaluates current professional AI title against a 4-tier taxonomy; career
  score (0–25 pts) weights career trajectory by tenure using sqrt(duration)
  to prevent single-role dominance; retrieval score (0–15 pts) measures
  search/ranking domain depth via skills, titles, and description keywords;
  assessment score (0–15 pts) uses weighted Redrob platform AI assessment
  results; skill trust score (0–10 pts) applies proficiency × endorsements ×
  duration to prevent keyword stuffing. A behavioral multiplier (×0.50–1.15)
  modulates the semantic score using recruiter response rate, notice period,
  GitHub activity, and profile completeness. The feature score is combined
  with all-MiniLM-L6-v2 cosine similarity at an 85/15 ratio. Total runtime:
  under 2 minutes for 100k candidates on a standard CPU. No GPUs. No APIs.

